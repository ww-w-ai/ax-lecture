<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Pdaily — 일상의 슈퍼 에이전트</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="fit">
  <!-- Pdaily [일상의 슈퍼 에이전트·자가진화] 하이브리드(bkit 템플릿=P55) — 좌: 제목·불릿 / 우: 일러스트 crop(../assets/P75-illust.png: 일상 데이터 누적→페르소나 진화). 신설 2026-07-06 (원 P75 재활용) -->
  <section class="slide light" id="Pdaily">
          <style>
            #Pdaily .s-title{ font-size:64px; }
            #Pdaily .s-title .acc{ color:var(--c1); }
            #Pdaily .s-eyebrow{ left:122px; top:208px; font-size:35px; font-weight:600; color:var(--muted); }
      
            #Pdaily .s-body{ top:323px; width:1040px; gap:30px; }
            #Pdaily .s-bullet{ font-size:36px; }
            #Pdaily .s-bullet .btxt{ line-height:1.34; }
            #Pdaily .s-bullet .head{ font-weight:800; color:var(--text); }
            #Pdaily .s-bullet .head .acc{ color:var(--c1); }
            #Pdaily .s-bullet .desc{ display:block; font-size:30px; font-weight:500; color:var(--secondary); margin-top:4px; }
      
            #Pdaily .keymsg .msg{ font-size:27px; font-weight:600; color:var(--text); }
            #Pdaily .keymsg .msg b{ color:var(--c1); font-weight:800; }
      
            /* 우측 일러스트 crop (bkit 템플릿=우측 축소, 원 P75 재활용) */
            #Pdaily .illust{ position:absolute; right:96px; top:296px; width:660px; height:auto; }
          </style>
      
          <h1 class="s-title">일상의 <span class="acc">슈퍼 에이전트</span></h1>
          <div class="s-eyebrow" style="inset: 208px auto auto 122px; font-size: 35px;"><span style="font-size: 33px;">특별한 업무를 넘어 매일의 나를 투영한다.</span></div>
      
          <div class="s-body" style="inset: 300px auto auto 120px;">
            <div class="s-bullet"><span class="dot"></span><span class="btxt" style="font-size: 36px;"><span class="head"><span style="font-size: 36px;">일상의 데이터가 <span class="acc">우선</span></span><span class="acc"></span></span><span class="desc"><span style="font-size: 30px;">일상이 나의 페르소나를 담을 그릇입니다.</span></span></span></div>
            <div class="s-bullet"><span class="dot"></span><span class="btxt" style="font-size: 36px;"><span class="head"><span style="font-size: 36px;">일기·달력·가계부·이메일·연락처</span></span><span class="desc"><span style="font-size: 30px;">매일의 나를 이루는 것들이 수지 안에 쌓입니다.</span></span></span></div>
            <div class="s-bullet"><span class="dot"></span><span class="btxt" style="font-size: 36px;"><span class="head"><span style="font-size: 36px;">매일 스스로 <span class="acc" style="color: rgb(11, 95, 217);">자가 진화</span></span><span class="acc"></span></span><span class="desc"><span style="font-size: 30px;">데이터와 이력을 바탕으로, 에이전트가 매일 더 정교해집니다.</span></span></span></div>
          </div>
      
          <div class="imgframe" style="inset: 141px auto auto 913px; width: 899px; height: 697px; box-shadow: none; border-radius: 0px;"><img class="illust" alt="오늘의 대화·관심사·관계·리듬·수치이력·목표가 기둥으로 쌓여 '페르소나(나)가 매일 갱신됨 = 모든 실행이 나에게 최적화됨'로 이어지는 다이어그램, 하단에 단골 카페가 '오늘도 아아 드시죠?'로 맞이하는 장면" style="inset: 0px auto auto 0px; width: 899px; height: auto;" src="../assets/P75-illust.png"></div>
      
          <div class="keymsg" style="inset: 862px auto auto 120px;">
            <span class="tag">SAMPLE</span>
            <span class="msg">“오늘 스케줄을 확인하고, 동선에 맞춰 점심 식당을 예약한 뒤 <b>지수에게 초대 메일을 보내줘.</b>”</span>
          </div>
      
          <div class="s-footer">
            <span>에이전트 수지 · sooji.ai</span>
            <span class="s-pagenum">70</span>
          </div>
        </section>
</div>
</body>
</html>
