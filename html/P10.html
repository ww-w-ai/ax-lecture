<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P10 — 이제 곧, 1인 창업가의 자비스</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="fit">
  <section class="slide light" id="P10">
          <style>
            /* ── 페이지 고유 CSS (텍스트 중심 — 3 레버 카드가 메인 비주얼) ── */
            #P10 .s-body{ top:282px; width:960px; }
      
            /* 우상단 hero 일러스트 (final/P10.png에서 추출) */
            #P10 .p10-hero{ position:absolute; left:1140px; top:120px; width:720px; height:auto; }
      
            /* 3 레버 카드 행 */
            #P10 .p10-cards{ position:absolute; left:120px; top:648px; width:1680px;
              display:flex; gap:48px; }
            #P10 .p10-card{ flex:1; display:flex; flex-direction:column; align-items:center;
              text-align:center; padding:0 20px; }
            #P10 .p10-icon{ width:78px; height:78px; object-fit:contain; margin-bottom:10px; }
            #P10 .p10-card + .p10-card{ border-left:1px solid var(--rule); }
            #P10 .p10-card-head{ display:flex; align-items:center; gap:16px; }
            #P10 .p10-num{ width:48px; height:48px; border-radius:50%; flex:none;
              border:3px solid var(--accent); color:var(--accent); font-weight:800; font-size:26px;
              display:flex; align-items:center; justify-content:center; }
            #P10 .p10-label{ font-size:40px; font-weight:700; color:var(--text); letter-spacing:-0.01em; }
            #P10 .p10-div{ width:120px; height:2px; background:var(--c1-soft); margin:14px 0 16px; }
            #P10 .p10-desc{ font-size:29px; line-height:1.4; color:var(--secondary); }
          </style>
      
          <h1 class="s-title">이제 곧, 1인 창업가의 자비스</h1>
      
          <img class="p10-hero" src="../assets/P10-hero.png" alt="1인 창업가의 자비스 — 홀로그램 AI 비서가 앱들을 운영하는 모습" style="inset: 190px auto auto 1101px; width: 699px; height: auto;">
      
          <div class="s-body" style="inset: 282px auto auto 120px;">
            <div class="s-bullet">
              <span class="dot"></span>
              <span class="btxt">자비스 = <span class="acc">부르면 만들고, 알아서 운영하고,<br>자리를 비워도 돌아가는</span> 이상적 AI 비서.</span>
            </div>
            <div class="s-bullet">
              <span class="dot"></span>
              <span class="btxt">영화 속 얘기였지만 — <span class="hl">이제 곧 그 시대가 온다.</span> <br>1인 창업가도 자기만의 자비스를 가질 수 있다.</span>
            </div>
          </div>
      
          <div class="p10-cards">
            <div class="p10-card">
              <img class="p10-icon" src="../assets/P10-ic-make.png" alt="">
              <div class="p10-card-head"><span class="p10-num">1</span><span class="p10-label">만들기</span></div>
              <div class="p10-div"></div>
              <div class="p10-desc">요청하면<br>앱을 만들어 낸다.</div>
            </div>
            <div class="p10-card">
              <img class="p10-icon" src="../assets/P10-ic-auto.png" alt="">
              <div class="p10-card-head"><span class="p10-num">2</span><span class="p10-label">자동화</span></div>
              <div class="p10-div"></div>
              <div class="p10-desc">운영(일정·메일·문서·리서치)을<br>알아서 처리한다.</div>
            </div>
            <div class="p10-card">
              <img class="p10-icon" src="../assets/P10-ic-drive.png" alt="">
              <div class="p10-card-head"><span class="p10-num">3</span><span class="p10-label">자율주행</span></div>
              <div class="p10-div"></div>
              <div class="p10-desc">자리를 비워도<br>일이 계속 진행된다.</div>
            </div>
          </div>
      
          <div class="s-footer">
            <span>주식회사 덥덥덥 · ww-w.ai</span>
            <span class="s-pagenum">10</span>
          </div>
        </section>
</div>
</body>
</html>
