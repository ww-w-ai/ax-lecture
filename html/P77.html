<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P77 — 사례 ① 1인 사업자의 어느 하루</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="fit">
  <!-- P77 [사례①·하루 타임라인] 하이브리드 — 상단 해→달 아크(HTML) + 5칸 타임라인 카드 전체 crop(../assets/P77-illust.png: 아침7시~밤, 배지+일러스트+설명 포함) + 하단 키메시지 -->
  <section class="slide light" id="P77">
    <style>
      #P77 .s-title{ font-size:72px; }

      /* 해→달 아크 */
      #P77 .p77-arc{ position:absolute; left:120px; top:250px; width:1680px; height:70px; }
      #P77 .p77-arc .sun, #P77 .p77-arc .moon{ position:absolute; top:8px; width:46px; height:46px;
        color:var(--c3); }
      #P77 .p77-arc .moon{ color:var(--c2); left:1634px; }
      #P77 .p77-arc .sun{ left:0; }
      #P77 .p77-arc .dash{ position:absolute; left:64px; top:26px; width:1552px; height:1px;
        border-top:2px dashed var(--rule); }

      #P77 .p77-illust{ position:absolute; left:120px; top:352px; width:1680px; height:auto; }

      #P77 .keymsg{ bottom:120px; }
      #P77 .keymsg .body{ font-size:38px; font-weight:700; color:var(--text); }
      #P77 .keymsg .acc{ color:var(--c1); font-weight:800; }
    </style>

    <h1 class="s-title">사례 ① — 1인 사업자의 어느 하루</h1>

    <div class="p77-arc">
      <svg class="sun" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <div class="dash"></div>
      <svg class="moon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </div>

    <img class="p77-illust" src="../assets/P77-illust.png" alt="아침7시 거래처메일 3줄요약 → 이동 같은 수지 → 미팅 혼잡도·날씨 즉답 → 오후 사업지출 정리 → 밤 닫아도 깨어있음, 5칸 하루 타임라인">

    <div class="keymsg">
      <span class="tag">KEY</span>
      <span class="body">노트북을 닫아도 <span class="acc">수지</span>는 깨어 있다</span>
    </div>

    <div class="s-footer">
      <span>에이전트 수지 · sooji.ai</span>
      <span class="s-pagenum">77</span>
    </div>
  </section>
</div>
</body>
</html>
