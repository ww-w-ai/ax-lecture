<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Pdash — 눈으로 보면서 소통한다 (대시보드)</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="fit">
  <!-- Pdash [대시보드·눈으로 본다] 하이브리드 — 좌: 제목·불릿 / 우: 실제 수지 대시보드 스크린샷(../assets/Pdash-screen.png)을 imgframe 로. 신설 2026-07-06 -->
  <section class="slide light" id="Pdash">
                      <style>
                        #Pdash .s-title{ font-size:64px; }
                        #Pdash .s-title .acc{ color:var(--c1); }
                        #Pdash .s-eyebrow{ left:122px; top:202px; font-size:35px; font-weight:600; color:var(--muted); }
                        #Pdash .s-body{ top:323px; width:772px; gap:30px; }
                        #Pdash .s-bullet{ font-size:36px; }
                        #Pdash .s-bullet .btxt{ line-height:1.32; }
                        #Pdash .s-bullet .head{ font-weight:800; color:var(--text); }
                        #Pdash .s-bullet .head .acc{ color:var(--c1); }
                        #Pdash .s-bullet .desc{ display:block; font-size:30px; font-weight:500; color:var(--secondary); margin-top:4px; }
                        /* 우측: 실제 대시보드 스크린샷 = 표준 .imgframe (E모드 크롭·스케일·줌 지원). 위치·크기는 요소 인라인. */
                        #Pdash .keymsg .msg{ font-size:28px; font-weight:600; color:var(--text); }
                        #Pdash .keymsg .msg b{ color:var(--c1); font-weight:800; }
                      </style>
                  
                      <h1 class="s-title">눈으로 보면서 <span class="acc">소통</span>한다</h1>
                      <div class="s-eyebrow">깜깜이로 다 맡기는 건, 이제 그만</div>
                  
                      <div class="s-body" style="inset: 323px auto auto 120px;">
                        <div class="s-bullet"><span class="dot"></span><span class="btxt"><span class="head">도서관(위키)</span><span class="desc">모든 지식을 직접 조회, 관계 그래프로 연관 지식까지</span></span></div>
                        <div class="s-bullet"><span class="dot"></span><span class="btxt"><span class="head">일정·캘린더·할일·D-day</span><span class="desc">나의 일정과 할 일을 한눈에, 간단한 건 UI 로 쉽게 조작</span></span></div>
                        <div class="s-bullet"><span class="dot"></span><span class="btxt"><span class="head">루틴·와처·브리핑</span><span class="desc">나만의 루틴·이벤트·매일 받는 브리핑을 조회·제어</span></span></div>
                        <div class="s-bullet"><span class="dot"></span><span class="btxt"><span class="head">메일·가계부·일기·지표</span><span class="desc">내 정보를 조회하고, 시간에 따른 변화까지 모니터링</span></span></div>
                      </div>
                  
                <div class="imgframe" style="position: absolute; inset: 300px auto auto 865px; width: 935px; height: 608px; border-radius: 16px; box-shadow: rgba(0, 0, 0, 0.08) 0px 0px 0px 1.5px, rgba(0, 0, 0, 0.14) 0px 20px 50px;"><img style="left: 0px; top: 0px; width: 935px; height: auto;" alt="수지 대시보드 — 좌측 사이드바(라이브러리·메모·지표 / 일정·캘린더·D-day·할일 / 루틴·스크립트·Watcher·브리핑 / 가계부 / 앱 / 페르소나) + 홈에 '늦은 밤이네요' 인사, 일정·할일·돈 카드" src="../assets/Pdash-screen.png"></div>
                  
                      
                  
                      <div class="s-footer">
                        <span>에이전트 수지 · sooji.ai</span>
                        <span class="s-pagenum">71</span>
                      </div>
                    </section>
</div>
</body>
</html>
