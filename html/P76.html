<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P76 — 1인 사업자의 하루를 수지에게</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="fit">
  <!-- P76 [수지 도입·위임 사례] 하이브리드 — 상단 2개 말풍선 텍스트(HTML) + 우측 아이콘 플로우 crop(../assets/P76-illust.png: 서재→실세계앱→시간비서→페르소나 2줄) + 하단 키라인 -->
  <section class="slide light" id="P76">
    <style>
      #P76 .s-title{ font-size:66px; }

      #P76 .p76-box{ position:absolute; left:120px; width:1680px; height:290px;
        border:2px solid var(--c1); border-radius:26px; background:#fff; }
      #P76 .p76-box.b1{ top:242px; }
      #P76 .p76-box.b2{ top:552px; }

      #P76 .p76-quote{ position:absolute; left:150px; width:860px; z-index:2; }
      #P76 .p76-quote .qmark{ font-size:64px; font-weight:900; color:var(--c1); line-height:1; margin:0 0 6px; }
      #P76 .p76-quote .qtext{ font-size:36px; font-weight:700; color:var(--text); line-height:1.42; }

      #P76 .p76-illust{ position:absolute; left:1075px; top:236px; height:610px; width:auto; z-index:2; }

      #P76 .p76-key{ position:absolute; left:120px; top:872px; width:1680px;
        display:flex; align-items:center; gap:16px; }
      #P76 .p76-key .s-ic{ width:44px; height:44px; color:var(--c1); }
      #P76 .p76-key .txt{ font-size:38px; font-weight:800; color:var(--c1); letter-spacing:-0.01em; }
    </style>

    <h1 class="s-title">1인 사업자의 하루를 수지에게</h1>

    <div class="p76-box b1"></div>
    <div class="p76-box b2"></div>

    <div class="p76-quote" style="top:270px;">
      <div class="qmark">&ldquo;</div>
      <div class="qtext">오늘 스케줄 확인하고, 동선에 맞춰 점심 식당 예약한 뒤 지수에게 초대 메일 보내줘.</div>
    </div>
    <div class="p76-quote" style="top:580px;">
      <div class="qmark">&ldquo;</div>
      <div class="qtext">안 가본 지역으로 출장/워크숍을, 적당한 예산에 맞춰 색다르게 짜줘.</div>
    </div>

    <img class="p76-illust" src="../assets/P76-illust.png" alt="서재(스케줄 확인/리서치) → 실세계 앱(식당 예약/지역·교통 탐색) → 시간 비서(동선 최적화/예산·일정 최적화) → 페르소나(지수에게 메일/여행·워크숍 설계) 2줄 아이콘 플로우">

    <div class="p76-key">
      <svg class="s-ic" viewBox="0 0 24 24" fill="var(--c1)" stroke="none"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
      <span class="txt">‘백오피스 직원’ — 그 자리를 수지가</span>
    </div>

    <div class="s-footer">
      <span>에이전트 수지 · sooji.ai</span>
      <span class="s-pagenum">76</span>
    </div>
  </section>
</div>
</body>
</html>
