<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>tene — API</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="fit">
  <!-- tene 쇼케이스: 위 설명(3줄) + 아래 브라우저 스크린샷(하단 살짝 bleed) -->
  <section class="slide light" id="teneApi">
    <style>
      #teneApi{ background:#EFEFEC; }
      #teneApi .s-title{ position:absolute; left:120px; top:52px; font-size:56px; font-weight:800; letter-spacing:-.01em; color:var(--text); }
      #teneApi .s-title .nm{ color:var(--c3-deep,var(--c3)); }
      #teneApi .s-body{ position:absolute; left:120px; top:170px; width:1680px; display:flex; flex-direction:column; gap:16px; }
      #teneApi .s-bullet{ font-size:33px; line-height:1.34; color:var(--secondary); display:flex; gap:18px; align-items:flex-start; }
      #teneApi .s-bullet .dot{ width:12px; height:12px; border-radius:50%; background:var(--c3-deep,var(--c3)); flex:none; margin-top:13px; }
      #teneApi .s-bullet b{ color:var(--text); font-weight:800; }
      #teneApi .s-bullet .hi{ color:var(--c3-deep,var(--c3)); font-weight:800; }
      #teneApi .shot{ position:absolute; top:372px; left:0; right:0; margin-left:auto; margin-right:auto;
        width:1400px; height:auto; display:block; }
    </style>

    <h1 class="s-title"><span class="nm">API</span> — 기능을 쉬운 말로 번역</h1>

    <div class="s-body">
      <div class="s-bullet"><span class="dot"></span><span>개발자만 알던 <span class="hi">‘API’</span>를 <b>쉬운 말로 번역</b></span></div>
      <div class="s-bullet"><span class="dot"></span><span><b>“이 기능은 무엇을 입력받아, 어느 데이터를 읽고/쓰는가”</b>를 보여줌</span></div>
      <div class="s-bullet"><span class="dot"></span><span>확실한 정보인지 <b>신뢰도까지 표기</b>해서 — AI가 흔히 하는 <b>‘그럴듯한 거짓말’</b>을 막는다!</span></div>
    </div>

    <img class="shot" src="../generated/_screenshots/tene-004.png" alt="tene API — 기능을 쉬운 말로 번역">
  </section>
</div>
</body>
</html>
