<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Pdata — 데이터 주권, 내 데이터는 내가 관리</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="fit">
  <!-- Pdata [데이터 주권] 하이브리드(bkit 템플릿=P55) — 좌: 제목·불릿 / 우: 일러스트 crop(../assets/P69-illust.png: 5층 책장 공개~비밀 + 격리 금고 + 내 서버로). 신설 2026-07-06 (원 P69 재활용) -->
  <section class="slide light" id="Pdata">
                      <style>
                        #Pdata .s-title{ font-size:64px; }
                        #Pdata .s-title .acc{ color:var(--c1); }
                        #Pdata .s-eyebrow{ left:122px; top:208px; font-size:35px; font-weight:600; color:var(--muted); }
                        #Pdata .s-body{ top:323px; width:1040px; gap:30px; }
                        #Pdata .s-bullet{ font-size:36px; }
                        #Pdata .s-bullet .btxt{ line-height:1.34; }
                        #Pdata .s-bullet .head{ font-weight:800; color:var(--text); }
                        #Pdata .s-bullet .head .acc{ color:var(--c1); }
                        #Pdata .s-bullet .desc{ display:block; font-size:30px; font-weight:500; color:var(--secondary); margin-top:4px; }
                        #Pdata .keymsg .msg{ font-size:28px; font-weight:600; color:var(--text); }
                        #Pdata .keymsg .msg b{ color:var(--c1); font-weight:800; }
                        #Pdata .illust{ position:absolute; right:120px; top:288px; width:600px; height:auto; }
                      </style>
                  
                      <h1 class="s-title" style="inset: 120px auto auto 120px;">데이터 <span class="acc">주권</span> — 나의 데이터는 내가 관리한다.</h1>
                      
                  
                      <div class="s-body" style="inset: 323px auto auto 120px; width: 844px;">
                        <div class="s-bullet"><span class="dot"></span><span class="btxt"><span class="head">유저마다 <span class="acc">전용 DB</span></span><span class="desc">남과 섞이지 않는, 나만의 <span style="font-weight: bold; color: rgb(11, 95, 217);">독립 데이터베이스</span> 할당</span></span></div>
                        <div class="s-bullet"><span class="dot"></span><span class="btxt"><span class="head">5가지 데이터 모드</span><span class="desc">퍼블릭·공유·일반·개인·시크릿, <span style="color: rgb(11, 95, 217); font-weight: bold;">5가지 타입의 공개 범위</span></span></span></div>
                        <div class="s-bullet"><span class="dot"></span><span class="btxt"><span class="head">예민한 정보는 <span class="acc" style="">격리·시크릿</span></span><span class="desc">민감한 정보는 분리된 공간에서 시크릿 모드에서만 접근</span></span></div>
                        <div class="s-bullet"><span class="dot"></span><span class="btxt"><span class="head"><span class="chip chip--key" style="vertical-align:middle; margin-right:10px;">고급</span>내 서버로 직접</span><span class="desc">데이터만 직접 <span style="color: rgb(11, 95, 217); font-weight: bold;">유저가 </span><span style="color: rgb(11, 95, 217); font-weight: bold;">소유한 서버</span>에 구축해 연결할 수 있음</span></span></div>
                      </div>
                  
                      <div class="imgframe" style="inset: 253px auto auto 998px; width: 817px; height: 675px; box-shadow: none; border-radius: 0px;"><img class="illust" alt="공개·공유·일반·개인·비밀(금고) 5층 책장 + 우측 완전 격리 DB 금고(유저별 독립 저장소, 기본 비공개) + '내 서버로 옮기기' 문" style="inset: 36px auto auto -1px; width: 817px; height: auto;" src="../assets/P69-illust.png"></div>
                  
                      
                  
                      <div class="s-footer">
                        <span>에이전트 수지 · sooji.ai</span>
                        <span class="s-pagenum">72</span>
                      </div>
                    </section>
</div>
