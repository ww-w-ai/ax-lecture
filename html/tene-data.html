<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>tene — Data (ERD)</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="fit">
  <!-- tene 쇼케이스: 위 설명(3줄) + 아래 브라우저 스크린샷(하단 살짝 bleed) -->
  <section class="slide light" id="teneData">
    <style>
      #teneData{ background:#EFEFEC; }
      #teneData .s-title{ position:absolute; left:120px; top:52px; font-size:56px; font-weight:800; letter-spacing:-.01em; color:var(--text); }
      #teneData .s-title .nm{ color:#1F9E6B; }
      #teneData .s-body{ position:absolute; left:120px; top:170px; width:1680px; display:flex; flex-direction:column; gap:16px; }
      #teneData .s-bullet{ font-size:33px; line-height:1.34; color:var(--secondary); display:flex; gap:18px; align-items:flex-start; }
      #teneData .s-bullet .dot{ width:12px; height:12px; border-radius:50%; background:#1F9E6B; flex:none; margin-top:13px; }
      #teneData .s-bullet b{ color:var(--text); font-weight:800; }
      #teneData .s-bullet .hi{ color:#1F9E6B; font-weight:800; }
      #teneData .shot{ position:absolute; top:372px; left:0; right:0; margin-left:auto; margin-right:auto;
        width:1400px; height:auto; display:block; }
    </style>

    <h1 class="s-title"><span class="nm">Data (ERD)</span> — 데이터 창고 지도</h1>

    <div class="s-body">
      <div class="s-bullet"><span class="dot"></span><span>어떤 정보가 <b>어떤 구조로 저장</b>되는지(<b>표·관계</b>)를 그림으로</span></div>
      <div class="s-bullet"><span class="dot"></span><span><b>실제 저장된 값</b>까지 안전하게 미리보기</span></div>
      <div class="s-bullet"><span class="dot"></span><span><b>“내 고객 데이터가 진짜 어디에 어떻게 들어있나?”</b>를 눈으로 확인!</span></div>
    </div>

    <img class="shot" src="../generated/_screenshots/tene-005.png" alt="tene Data — ERD 데이터 창고 지도">
  </section>
</div>
</body>
</html>
