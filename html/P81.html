<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P81 — 실습: 클로드에 수지 연결</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="fit">
  <!-- P81 [실습·설치 클로드] 스크린샷 크게 + 푸터 복원(이미지 축소로 여백 확보). 뱃지='설치', 캡션 26px -->
  <section class="slide light" id="P81">
          <style>
            #P81 .badge{ position:absolute; left:120px; top:60px;
              background:var(--c1); color:#fff; font-weight:800; font-size:26px;
              padding:10px 24px; border-radius:999px; letter-spacing:.01em; }
            #P81 .s-title{ top:118px; font-size:52px; }
            #P81 .server{ position:absolute; left:120px; top:200px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
            #P81 .server .k{ font-size:21px; font-weight:700; color:var(--muted); }
            #P81 .server .url{ font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;
              font-size:24px; font-weight:700; color:var(--c1); background:var(--c1-soft); padding:5px 15px; border-radius:9px; }
            #P81 .server .login{ font-size:21px; font-weight:700; color:var(--text); }
            #P81 .server .login b{ color:var(--c2-deep); }
      
            #P81 .shots{ position:absolute; left:120px; top:258px; width:1680px;
              display:flex; gap:44px; align-items:flex-start; justify-content:center; }
            #P81 .fig{ display:flex; flex-direction:column; gap:12px; align-items:center; }
            #P81 .fig img{ height:632px; width:auto; border-radius:16px; border:1px solid var(--rule); box-shadow:0 14px 38px rgba(0,0,0,.13); }
            #P81 .fig .cap{ font-size:26px; font-weight:800; color:var(--text); }
            #P81 .fig .cap b{ color:var(--c1); }
          </style>
      
          <div class="badge">설치</div>
          <h1 class="s-title"><span style="color:var(--c1)">클로드</span>에 수지 연결하기</h1>
      
          <div class="server" style="inset: 200px auto auto 120px;">
            <span class="k"><span style="font-size: 25px;">서버 주소</span></span>
            <span class="url">https://mcp.sooji.ai/mcp</span>
            <span class="login"><span style="font-size: 25px;">· 로그인 = <b>구글 · 깃헙</b></span><b></b></span>
          </div>
      
          <div class="shots" style="inset: 258px auto auto 120px; font-size: 28px;">
            <div class="fig">
              <img alt="커넥터 목록에서 추가 → 커스텀 커넥터 추가" src="../assets/claude-mcp-1.png">
              <div class="cap"><b></b><span style="font-size: 28px;"><b>①</b> 사용자 지정 → 커넥터 → 추가 → 커스텀 커넥터 추가</span></div>
            </div>
            <div class="fig">
              <img alt="커스텀 커넥터 추가 모달 — 이름·원격 MCP 서버 URL" src="../assets/claude-mcp-2.png">
              <div class="cap"><b></b><span style="font-size: 28px;"><b>②</b> 이름 '수지' · MCP 서버 URL → 추가 → 연결</span></div>
            </div>
          </div>
      
          <!-- 덮개(patch) — 오른쪽 스크린샷 상단 잔여 텍스트 가림 (이미지 632px 기준 재계산) -->
          <div class="patch" style="position:absolute;z-index:20;left:1072px;top:260px;width:54px;height:13px;background:#fefefe;"></div>
          <div class="patch" style="position:absolute;z-index:20;left:1580px;top:261px;width:54px;height:11px;background:#fefefe;"></div>
      
          <div class="s-footer">
            <span>에이전트 수지 · sooji.ai</span>
            <span class="s-pagenum">81</span>
          </div>
        </section>
</div>
</body>
</html>
