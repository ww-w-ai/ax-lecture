<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P79 — 사례 ③ 반복 운영·돈 관리를 예약으로</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="fit">
  <!-- P79 [사례 ③·반복운영예약] 하이브리드 — 좌: 텍스트(HTML, 카드3개+KEY띠) / 우: 일러스트 crop(../assets/P79-illust.png: 캘린더·서버·달+노트북·시계 주간루프 다이어그램) -->
  <section class="slide light" id="P79">
    <style>
      #P79 .s-title{ font-size:64px; }

      #P79 .p79-cards{ position:absolute; left:120px; top:300px; width:760px;
        display:flex; flex-direction:column; gap:26px; }
      #P79 .p79-card{ border:1px solid var(--rule); border-radius:16px; background:#fff;
        display:flex; align-items:center; gap:22px; padding:22px 28px; }
      #P79 .p79-ic{ width:64px; height:64px; border-radius:50%; background:var(--c2-soft); color:var(--c2);
        display:flex; align-items:center; justify-content:center; flex:none; }
      #P79 .p79-ic .s-ic{ width:32px; height:32px; }
      #P79 .p79-txt{ flex:1 1 auto; font-size:32px; font-weight:700; color:var(--text); line-height:1.28; }
      #P79 .p79-tag{ flex:none; }

      #P79 .keymsg{ position:absolute; left:120px; top:660px; width:760px; bottom:auto;
        background:var(--c1-soft); flex-direction:column; align-items:flex-start; gap:8px; padding:28px 32px; }
      #P79 .keymsg .body{ font-size:34px; font-weight:700; color:var(--text); line-height:1.34; }
      #P79 .keymsg .acc{ color:var(--c1); font-weight:800; }

      /* 우측 일러스트 crop (ChatGPT 시안 = 디자이너 배치 유지) — 캘린더/서버/달·노트북/시계 주간루프 */
      #P79 .illust{ position:absolute; left:1183px; top:172px; width:737px; height:auto; }
    </style>

    <h1 class="s-title">사례 ③ — 반복 운영·돈 관리를 예약으로</h1>

    <div class="p79-cards">
      <div class="p79-card">
        <div class="p79-ic"><svg class="s-ic" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg></div>
        <div class="p79-txt">'계약·입금' 메일 즉시</div>
        <span class="chip chip--ter p79-tag">토큰 0</span>
      </div>
      <div class="p79-card">
        <div class="p79-ic"><svg class="s-ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
        <div class="p79-txt">인보이스 말일 알림</div>
        <span class="chip chip--ter p79-tag">토큰 0</span>
      </div>
      <div class="p79-card">
        <div class="p79-ic"><svg class="s-ic" viewBox="0 0 24 24"><path d="M20 12V8H6a2 2 0 0 1 0-4h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg></div>
        <div class="p79-txt">정기 지출 자동 기록</div>
        <span class="chip chip--ter p79-tag">토큰 0</span>
      </div>
    </div>

    <img class="illust" src="../assets/P79-illust.png" alt="세 카드에서 화살표로 이어지는 서버 랙, 위로 캘린더(반복), 오른쪽 아래로 이어지는 달+노트북(휴가), 아래 시계, 서버 옆 '토큰 0' 태그 — 주간 자동화 루프">

    <div class="keymsg">
      <span class="tag">KEY</span>
      <span class="body">한 번 시켜두면 <span class="acc">휴가 가도 운영이 돈다</span> (토큰 0)</span>
    </div>

    <div class="s-footer">
      <span>에이전트 수지 · sooji.ai</span>
      <span class="s-pagenum">79</span>
    </div>
  </section>
</div>
</body>
</html>
