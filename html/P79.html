<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P79 — 사례 ③ 챙길 날을 수지가 같이 센다</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="fit">
  <!-- P79 [사례③·D-day+일상] HTML 네이티브 — 3개 D-day 카운트다운 카드 + 곁들임(전시추천·관계타로) + 하단 ⑥관계 -->
  <section class="slide light" id="P79">
    <style>
      #P79 .s-eyebrow{ left:120px; top:118px; }
      #P79 .s-title{ top:158px; font-size:66px; }
      #P79 .ex{ position:absolute; right:120px; top:118px; font-size:22px; font-weight:800; color:var(--muted);
        border:1.5px solid var(--rule); border-radius:999px; padding:7px 18px; }

      /* 3개 D-day 카드 */
      #P79 .ddays{ position:absolute; left:120px; top:326px; width:1680px;
        display:grid; grid-template-columns:repeat(3,1fr); gap:36px; }
      #P79 .dd{ background:#fff; border:1px solid var(--rule); border-radius:22px; padding:34px 40px;
        box-shadow:0 10px 30px rgba(0,0,0,.06); position:relative; overflow:hidden; }
      #P79 .dd::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:8px; background:var(--ac); }
      #P79 .dd .label{ font-size:30px; font-weight:800; color:var(--text); }
      #P79 .dd .date{ font-size:22px; font-weight:700; color:var(--muted); margin-top:6px; }
      #P79 .dd .big{ font-size:96px; font-weight:800; color:var(--ac); line-height:1; margin-top:20px; letter-spacing:-0.02em; }
      #P79 .dd .alarm{ margin-top:18px; font-size:21px; font-weight:700; color:var(--ac); display:inline-flex; gap:8px; align-items:center; }
      #P79 .dd .alarm svg{ width:22px; height:22px; }
      #P79 .dd.c1{ --ac:var(--c1); } #P79 .dd.c2{ --ac:var(--c2); } #P79 .dd.c3{ --ac:var(--c3-deep); }

      /* 곁들임 */
      #P79 .side{ position:absolute; left:120px; top:646px; width:1680px; display:flex; align-items:stretch; gap:28px; }
      #P79 .side .lead{ align-self:center; font-size:26px; font-weight:800; color:var(--muted); flex:none; width:150px; line-height:1.3; }
      #P79 .scard{ flex:1 1 0; background:var(--c2-soft); border-radius:20px; padding:24px 30px; display:flex; gap:18px; align-items:center; }
      #P79 .scard svg{ width:44px; height:44px; color:var(--c2-deep); flex:none; }
      #P79 .scard .t{ font-size:24px; font-weight:800; color:var(--c2-deep); }
      #P79 .scard .d{ font-size:24px; font-weight:600; color:var(--text); margin-top:3px; }
      #P79 .scard.warm{ background:var(--c3-soft); }
      #P79 .scard.warm svg,#P79 .scard.warm .t{ color:var(--c3-deep); }

      #P79 .keymsg{ bottom:112px; }
      #P79 .keymsg .body{ font-size:36px; font-weight:700; color:var(--text); }
      #P79 .keymsg .acc{ color:var(--c1); font-weight:800; }
    </style>

    <div class="s-eyebrow">사례 ③ · 연애 100일 앞둔 민호(26)</div>
    <h1 class="s-title">챙길 날을, <span class="acc">수지가 같이 센다</span></h1>
    <div class="ex">예시 시나리오</div>

    <div class="ddays">
      <div class="dd c1">
        <div class="label">💛 100일</div>
        <div class="date">3월 14일 · 금</div>
        <div class="big">D-3</div>
        <div class="alarm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>7일 전·3일 전·당일 알림</div>
      </div>
      <div class="dd c2">
        <div class="label">200일</div>
        <div class="date">6월 22일 · 일</div>
        <div class="big">D-103</div>
        <div class="alarm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>미리 알림 예약됨</div>
      </div>
      <div class="dd c3">
        <div class="label">1주년</div>
        <div class="date">12월 5일 · 토</div>
        <div class="big">D-268</div>
        <div class="alarm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>미리 알림 예약됨</div>
      </div>
    </div>

    <div class="side">
      <div class="lead">이 날들에<br>곁들여</div>
      <div class="scard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        <div><div class="t">주말 전시·공연 추천</div><div class="d">100일에 갈 만한 곳, 근처로 3곳</div></div>
      </div>
      <div class="scard warm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 7.4H22l-6 4.5 2.3 7.1-6.3-4.6L5.7 21l2.3-7.1-6-4.5h7.6z"/></svg>
        <div><div class="t">오늘의 관계 타로</div><div class="d">가볍게 곁들이는 하루의 재미</div></div>
      </div>
    </div>

    <div class="keymsg">
      <span class="tag">⑥ 관계</span>
      <span class="body">도구가 아니라 <span class="acc">곁의 존재</span> — 챙길 날을 하나도 안 놓치게 같이 센다</span>
    </div>

    <div class="s-footer">
      <span>에이전트 수지 · sooji.ai</span>
      <span class="s-pagenum">79</span>
    </div>
  </section>
</div>
</body>
</html>
