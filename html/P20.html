<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P20 — 100만 컨텍스트 시대, 하지만 길수록 느리고 비싸다</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="fit">
  <section class="slide light" id="P20">
          <style>
            /* ── 페이지 고유 CSS (마스터 표준 override) ── */
            #P20 .s-body{ width:780px; }
      
            /* 경고 박스 */
            #P20 .p-warn{ position:absolute; left:120px; top:740px; width:780px; height:118px;
              border:2px solid var(--c1); border-radius:16px; display:flex; align-items:center;
              gap:26px; padding:0 38px; }
            #P20 .p-wbadge{ width:64px; height:64px; border-radius:50%; background:var(--c1); color:#fff;
              display:flex; align-items:center; justify-content:center; font-size:40px; font-weight:800; flex:none; }
            #P20 .p-wtext{ font-size:36px; font-weight:700; color:var(--text); }
      
            /* O(n²) 비용 곡선 (SVG) */
            #P20 .p-graph{ position:absolute; right:120px; top:215px; width:720px; }
          </style>
      
          <h1 class="s-title">100만 컨텍스트 시대, 하지만 길수록 느리고 비싸다</h1>
      
          <div class="s-body" style="inset: 300px auto auto 120px; width: 850px;">
            <div class="s-bullet">
              <span class="dot"></span>
              <span class="btxt">컨텍스트 윈도우가 <span class="acc">100만 토큰</span>까지 커졌다 — <span class="acc">하지만?</span></span>
            </div>
            <div class="s-bullet">
              <span class="dot"></span>
              <span class="btxt">컨텍스트가 길수록 리소스를 <span class="hl" style="">‘제곱’</span>&nbsp;으로 쓴다: 모든 토큰이 자신의 <em style="font-style:normal;font-weight:700;">모든 앞 토큰</em>을 다 계산하기 때문 <span style="color:var(--muted)">(N개 레이어라 N번 반복)</span></span>
            </div>
            <div class="s-bullet">
              <span class="dot"></span>
              <span class="btxt">내 구독이 빨리 만료되거나 API 사용료가 많이 나온다면, <span style="font-weight: bold;"><span style="color: rgb(230, 0, 18);">컨텍스트 크기를 적극 조절</span>&nbsp;</span>하세요.</span>
            </div>
          </div>
      
          
      
          <div class="p-graph" style="inset: 300px auto auto 1082px; width: 718px;">
            <svg viewBox="0 0 720 540" width="720" height="540" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="p20fill" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#E60012" stop-opacity="0.22"></stop>
                  <stop offset="1" stop-color="#E60012" stop-opacity="0.02"></stop>
                </linearGradient>
              </defs>
              <!-- grid -->
              <line x1="90" y1="160" x2="650" y2="160" stroke="#E2E1DD" stroke-width="2" stroke-dasharray="6 8"></line>
              <line x1="90" y1="280" x2="650" y2="280" stroke="#E2E1DD" stroke-width="2" stroke-dasharray="6 8"></line>
              <line x1="90" y1="400" x2="650" y2="400" stroke="#E2E1DD" stroke-width="2" stroke-dasharray="6 8"></line>
              <!-- area under curve -->
              <path d="M100,470 C 360,468 500,430 600,110 L600,470 Z" fill="url(#p20fill)"></path>
              <!-- axes -->
              <line x1="90" y1="70" x2="90" y2="470" stroke="#141417" stroke-width="3"></line>
              <line x1="90" y1="470" x2="660" y2="470" stroke="#141417" stroke-width="3"></line>
              <polygon points="90,58 83,76 97,76" fill="#141417"></polygon>
              <polygon points="672,470 654,463 654,477" fill="#141417"></polygon>
              <!-- quadratic-ish cost curve -->
              <path d="M100,470 C 360,468 500,430 600,110" fill="none" stroke="#E60012" stroke-width="7" stroke-linecap="round"></path>
              <!-- labels -->
              <text x="440" y="185" font-family="Pretendard, sans-serif" font-size="36" font-weight="800" font-style="italic" fill="#E60012" text-anchor="end">O(n²)</text>
              <text x="100" y="44" font-family="Pretendard, sans-serif" font-size="26" font-weight="700" fill="#141417">리소스 사용</text>
              <text x="650" y="512" font-family="Pretendard, sans-serif" font-size="26" font-weight="700" fill="#141417" text-anchor="end">컨텍스트 크기</text>
              <!-- warning bang -->
              <circle cx="640" cy="92" r="26" fill="#E60012"></circle>
              <text x="640" y="104" font-family="Pretendard, sans-serif" font-size="34" font-weight="800" fill="#fff" text-anchor="middle">!</text>
            </svg>
          </div>
      
          <div class="s-footer">
            <span>에이전트 수지 · sooji.ai</span>
            <span class="s-pagenum">20</span>
          </div>
        </section>
</div>
</body>
</html>
