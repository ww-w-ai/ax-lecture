<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P27 — 추가 추천 도구</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="fit">
  <section class="slide light" id="P27">
    <style>
      /* ── 페이지 고유 (마스터 표준 override) ── */
      #P27 .cards{ position:absolute; left:120px; top:300px; width:1680px;
        display:grid; grid-template-columns:repeat(3,1fr); gap:40px; }
      #P27 .card{ background:#fff; border:1px solid var(--rule); border-radius:20px;
        padding:32px 36px; min-height:420px; }
      #P27 .card .shot{ display:block; width:100%; height:224px; object-fit:contain;
        object-position:top center; margin-bottom:26px; }
      #P27 .card .nm{ color:var(--c1); font-weight:800; font-size:42px; margin-bottom:18px; }
      #P27 .card .ds{ color:var(--text); font-weight:400; font-size:32px; line-height:1.46; }
      #P27 .closing{ position:absolute; left:120px; top:878px; width:1680px; text-align:center;
        color:var(--c1); font-weight:800; font-size:42px; letter-spacing:-0.01em; }
    </style>

    <h1 class="s-title">추가 추천 도구</h1>

    <div class="cards">
      <div class="card">
        <img class="shot" src="assets/P27-agentrunner.png" alt="AgentRunner — macOS 메뉴바 픽셀 캐릭터 화면">
        <div class="nm">AgentRunner</div>
        <div class="ds">macOS 메뉴바에서 AI 에이전트의 작업 상태를 16픽셀 캐릭터 애니메이션으로 실시간 표시.</div>
      </div>
      <div class="card">
        <img class="shot" src="assets/P27-keeph.png" alt="keeph — 터미널 화면">
        <div class="nm">keeph</div>
        <div class="ds">Mac을 정확히 N시간만 깨어있게 유지하고 자동으로 슬립 복구하는 zsh 한 줄 명령.</div>
      </div>
      <div class="card">
        <img class="shot" src="assets/P27-vmux.png" alt="vmux — 데스크톱 앱 화면">
        <div class="nm">vmux</div>
        <div class="ds">Claude Code · Codex를 편하게 <br>쓸 수 있게 만든 덥덥덥 자체 개발<br>데스크톱 앱.</div>
      </div>
    </div>

    <div class="closing">스스로 만들어 쓰는 시대 — 오픈소스로 참고하고 더욱 개선해보세요.</div>

    <div class="s-footer">
      <span>에이전트 수지 · sooji.ai</span>
      <span class="s-pagenum">27</span>
    </div>
  </section>
</div>
</body>
</html>
