<div class="fit">

      #teneAi{ background:#EFEFEC; }

    <h1 class="s-title"><span class="nm">AI Agent</span> — 지도를 쥔 AI</h1>

    </div>

    <img class="shot" src="../generated/_screenshots/tene-006.png" alt="tene AI Agent — 지도를 쥔 AI">
