<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P42 — 코딩 전에 '기획서'부터</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="fit">
  <!-- P42 [도식] 중앙: '기능 1개(PM팀)' + '기능 N개(Sprint)' 2행 도식 이미지(generated/P42.png crop, '둘 다 공통' 행 제거) / 하단: KEY MESSAGE 밴드 -->
  <section class="slide light" id="P42">
    <style>
      #P42 .s-title{ font-size:64px; line-height:1.15; }
      /* 중앙 도식 이미지 (2행) — 제목~키밴드 사이 세로 중앙 */
      #P42 .s-illust{ left:210px; top:325px; width:1500px; height:auto; }
      /* 하단 MESSAGE 띠 — 위치는 마스터 .keymsg(하단 밴드 통일) */
      #P42 .keymsg .msg{ font-size:32px; font-weight:600; color:var(--text); line-height:1.3; }
      #P42 .keymsg .msg .acc{ color:var(--c1); }
    </style>

    <h1 class="s-title">코딩 전에 '기획서'부터 — 혼자가 아니라 팀이</h1>

    <img class="s-illust" src="assets/P42-diagram.png" alt="기능 1개는 PM 팀(pm-discovery·pm-strategy·pm-research·pm-prd)이 PRD를 만들고(/pdca pm), 기능 N개는 /sprint init으로 sprint-master-planner가 5단계 타임라인에 기능 A~H를 배치해 마스터플랜을 만든다(/sprint start)">

    <div class="keymsg">
      <span class="tag">MESSAGE</span>
      <span class="msg">감으로 시작하지 않는다 — 팀이 만든 <span class="acc">기획서가 자율주행의 출발점</span>.</span>
    </div>

    <div class="s-footer">
      <span>에이전트 수지 · sooji.ai</span>
      <span class="s-pagenum">42</span>
    </div>
  </section>
</div>
</body>
</html>
