<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P41 — Sprint 실제 사례 (bkit dogfooding)</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="fit">
  <!-- P41 [사례] 중앙 대형 도식 = generated/P41.png 중앙부 crop(제목·KEY MESSAGE 밴드 제외) 1장 유지 / 하단 KEY MESSAGE = HTML 텍스트 -->
  <section class="slide light" id="P41">
    <style>
      #P41 .s-title{ font-size:50px; line-height:1.18; }
      /* 중앙 도식 (한 장, 제목~키메시지 밴드 사이 존에 가로 중앙) */
      #P41 .s-illust{ left:270px; top:240px; width:1380px; height:auto; }
      /* 하단 MESSAGE 띠 — 위치는 마스터 .keymsg(하단 밴드 통일) */
      #P41 .keymsg .msg{ font-size:32px; font-weight:600; color:var(--text); line-height:1.3; }
      #P41 .keymsg .msg .acc{ color:var(--c1); }
    </style>

    <h1 class="s-title">Sprint 실제 사례 — bkit이 자기 문서를 자율주행으로 만들다 (dogfooding)</h1>

    <img class="s-illust" src="assets/P41-diagram.png" alt="/sprint init v2113-docs-sync --features f0…f9 --trust L4 명령으로 시작 → bkit이 자기 자신(v2.1.13 문서 동기화)을 dogfooding(self-validation)으로 수행. Sprint 컨테이너(f0…f9)가 prd→plan→design→do→iterate→qa→report→archived 수명주기를 사람 개입 없이(자리 비움·무인) 완주하고 archived 산출물(master-plan·PRD·plan·design·최종 리포트)을 남긴다.">

    <div class="keymsg">
      <span class="tag">MESSAGE</span>
      <span class="msg">기능 목록만 줬더니, bkit이 <span class="acc">자기 자신을 무인으로 릴리스</span>했다.</span>
    </div>

    <div class="s-footer">
      <span>주식회사 덥덥덥 · ww-w.ai</span>
      <span class="s-pagenum">41</span>
    </div>
  </section>
</div>
</body>
</html>
