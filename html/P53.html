<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P53 — 코드깎는노인의 bkit 리뷰</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="fit">
  <section class="slide light" id="P53">
    <style>
      #P53 .s-title{ font-size:64px; line-height:1.233; }
      #P53 .s-body{ width:760px; top:340px; gap:36px; }
      #P53 .shot{ position:absolute; right:120px; top:330px; width:840px; height:560px;
        border-radius:12px; border:1px solid var(--rule); box-shadow:0 14px 44px rgba(0,0,0,.13);
        object-fit:cover; object-position:top center; background:#fff; }
      #P53 .linkbox{ display:inline-flex; align-items:center; gap:12px; }
      #P53 .keymsg{ position:static; width:760px; }   /* 인라인(body flow) — 마스터의 하단 밴드 위치 해제 */
      #P53 .keymsg .msg{ font-size:34px; font-weight:600; color:var(--text); line-height:1.32; }
    </style>

    <h1 class="s-title">직접 데모 대신: 코드깎는노인의 bkit 리뷰</h1>

    <img class="shot" src="../generated/_screenshots/P53-codenoin-youtube.png" alt="코드깎는노인 bkit 리뷰 유튜브">

    <div class="s-body">
      <div class="s-bullet">
        <span class="dot"></span>
        <span class="btxt">개발 유튜버 <span class="acc">'코드깎는노인'</span>의 bkit 리뷰 — 직접 써보고 평가한 <span class="hl">외부 검증</span></span>
      </div>
      <div class="s-bullet">
        <span class="dot"></span>
        <span class="btxt"><span class="linkbox"><code style="font-size:27px;background:#F2F1EE;padding:4px 12px;border-radius:6px;color:var(--c2);">youtube.com/watch?v=EZwffHVx05U</code></span></span>
      </div>
      <div class="keymsg">
        <span class="tag">KEY</span>
        <span class="msg">내 말 말고, <span class="acc">직접 써본 개발자</span>의 평가를 보세요.</span>
      </div>
    </div>

    <div class="s-footer">
      <span>주식회사 덥덥덥 · ww-w.ai</span>
      <span class="s-pagenum">53</span>
    </div>
  </section>
</div>
