<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P69 — 데이터 주권 — 내 정보는 내가 쥔다</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="fit">
  <!-- P69 [데이터 주권] 하이브리드 — 좌: 텍스트(HTML) / 우: 일러스트 crop(../assets/P69-illust.png: 5층 서가 + 완전격리 DB 금고 + 내 서버로 옮기기 문) -->
  <section class="slide light" id="P69">
    <style>
      #P69 .s-title{ font-size:68px; line-height:1.18; width:700px; }

      #P69 .s-body{ top:300px; width:700px; gap:36px; }
      #P69 .s-bullet{ font-size:36px; }
      #P69 .s-bullet .s-ic{ width:38px; height:38px; color:var(--c1); flex:none; margin-top:2px; }
      #P69 .s-bullet .btxt{ line-height:1.4; }
      #P69 .s-sub{ font-size:28px; }

      /* KEY MESSAGE 띠 — 좌측 폭에 맞춰 좁힘 */
      #P69 .keymsg{ left:120px; width:700px; bottom:150px; padding:26px 32px; }
      #P69 .keymsg .txt{ font-size:32px; font-weight:700; line-height:1.35; }

      /* 우측 일러스트 crop (ChatGPT 시안 = 5층 서가 + 완전격리 DB 금고 + 내 서버로 옮기기) */
      #P69 .illust{ position:absolute; left:821px; top:55px; width:1099px; height:auto; }
    </style>

    <h1 class="s-title">데이터 주권 — 내 정보는 내가 쥔다</h1>

    <div class="s-body">
      <div class="s-bullet">
        <svg class="s-ic" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="btxt"><span class="strike">앱 종속</span> 끝 — <span class="acc">유저가 쥔다</span></span>
      </div>

      <div class="s-bullet">
        <svg class="s-ic" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
        <span class="btxt">남들: 툴마다 격리 DB = <span class="acc">YOLO 권한</span></span>
      </div>

      <div class="s-bullet">
        <svg class="s-ic" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span class="btxt">수지: <span class="acc2">5층 + 금고</span> + 분석 제외</span>
      </div>
    </div>

    <div class="keymsg">
      <span class="tag">KEY</span>
      <span class="txt">기본은 아무것도 안 나감 — 공유는 <span class="acc">명시적 지정</span>만</span>
    </div>

    <img class="illust" src="../assets/P69-illust.png" alt="5층 서가(공개·공유·일반·개인·비밀(금고)) + 완전 격리 DB 금고(유저별 독립 저장소, 기본 비공개) + 내 서버로 옮기기 문">

    <div class="s-footer">
      <span>에이전트 수지 · sooji.ai</span>
      <span class="s-pagenum">00</span>
    </div>
  </section>
</div>
</body>
</html>
