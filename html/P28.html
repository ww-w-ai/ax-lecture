<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P28 — 정리</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="fit">
  <section class="slide light" id="P28">
    <style>
      /* ── 페이지 고유 (마스터 표준 override) ── */
      #P28 .s-eyebrow{ left:120px; top:120px; font-size:34px; }
      #P28 .s-title{ top:182px; font-size:72px; line-height:1.250; }

      /* 토큰 → … → 분신 에이전트 단계적 확대 progression */
      #P28 .flow{ position:absolute; left:120px; top:520px; width:1680px;
        display:flex; align-items:center; justify-content:space-between; }
      #P28 .step{ display:flex; align-items:center; justify-content:center; text-align:center;
        border:2px solid var(--c1); border-radius:16px; background:#fff; color:var(--text);
        font-weight:700; letter-spacing:-0.01em; padding:0 8px; }
      #P28 .s1{ width:150px; height:88px; font-size:30px; opacity:.78; }
      #P28 .s2{ width:170px; height:104px; font-size:32px; opacity:.85; }
      #P28 .s3{ width:190px; height:120px; font-size:34px; opacity:.92; }
      #P28 .s4{ width:230px; height:142px; font-size:36px; background:var(--c1-soft); }
      #P28 .s5{ width:300px; height:170px; font-size:40px; font-weight:800;
        background:var(--c1); border-color:var(--c1); color:#fff; line-height:1.18; }
      #P28 .arr{ color:var(--c1); font-size:42px; font-weight:800; flex:none; }

      #P28 .closing{ position:absolute; left:120px; top:824px;
        color:var(--c1); font-weight:800; font-size:54px; letter-spacing:-0.01em; }
    </style>

    <div class="s-eyebrow">정리</div>
    <h1 class="s-title">단 한 개의 토큰이<br>인공지능의 정체이며<br>모든 것을 만든다</h1>

    <div class="flow">
      <div class="step s1">토큰</div>
      <span class="arr">→</span>
      <div class="step s2">문장</div>
      <span class="arr">→</span>
      <div class="step s3">문서</div>
      <span class="arr">→</span>
      <div class="step s4">코드베이스</div>
      <span class="arr">→</span>
      <div class="step s5">분신 에이전트</div>
    </div>

    <div class="closing">정말 신기하지 않나요?</div>

    <div class="s-footer">
      <span>에이전트 수지 · sooji.ai</span>
      <span class="s-pagenum">28</span>
    </div>
  </section>
</div>
</body>
</html>
