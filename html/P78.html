<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P78 — 사례 ② 시장·경쟁사 모니터링을 위임</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="fit">
  <!-- P78 [사례②·시장 모니터링] 하이브리드 — 말풍선(HTML) + 4칸 플로우 카드 전체 crop(../assets/P78-illust.png: 뉴스·블로그→공시·주식→문서로 저장→뜻으로 검색) + 하단 note/키메시지(HTML) -->
  <section class="slide light" id="P78">
    <style>
      #P78 .s-title{ font-size:64px; }

      #P78 .p78-quote{ position:absolute; left:120px; top:260px; width:760px;
        border:2px solid var(--c1); border-radius:18px; background:var(--c1-soft);
        padding:22px 36px; }
      #P78 .p78-quote .mark{ font-size:40px; font-weight:800; color:var(--c1); font-family:Georgia,serif; }
      #P78 .p78-quote .txt{ font-size:32px; font-weight:700; color:var(--text); line-height:1.32; margin-top:4px; }

      #P78 .p78-illust{ position:absolute; left:120px; top:410px; width:1680px; height:auto; }

      #P78 .p78-note{ position:absolute; left:120px; top:706px; display:flex; align-items:center; gap:16px;
        color:var(--secondary); font-size:27px; font-weight:500; }
      #P78 .p78-note .s-ic{ width:32px; height:32px; color:var(--c3-deep); flex:none; }
      #P78 .p78-note .hl{ font-weight:700; }

      #P78 .keymsg{ bottom:120px; }
      #P78 .keymsg .body{ font-size:38px; font-weight:700; color:var(--text); }
      #P78 .keymsg .acc{ color:var(--c1); font-weight:800; }
    </style>

    <h1 class="s-title">사례 ② — 시장·경쟁사 모니터링을 위임</h1>

    <div class="p78-quote">
      <div class="mark">&#8220;</div>
      <div class="txt">경쟁사 뉴스, 매주 월요일 아침에</div>
    </div>

    <img class="p78-illust" src="../assets/P78-illust.png" alt="뉴스·블로그 리서치 → 공시·주식 확인 → 문서로 저장 → 뜻으로 검색·회수, 4칸 시장 모니터링 플로우">

    <div class="p78-note">
      <svg class="s-ic" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      새 소식 없어도 <span class="hl">'이번 주 새 동향 없음'</span>을 남긴다
    </div>

    <div class="keymsg">
      <span class="tag">KEY</span>
      <span class="body">리서치 외주 없이 <span class="acc">'시장 조사 담당자'</span> 한 명</span>
    </div>

    <div class="s-footer">
      <span>에이전트 수지 · sooji.ai</span>
      <span class="s-pagenum">78</span>
    </div>
  </section>
</div>
</body>
</html>
