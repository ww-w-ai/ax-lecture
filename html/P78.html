<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P78 — 사례 ② 한 번 물으면 네 앱을 가로질러 답한다</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="fit">
  <!-- P78 [사례②·통합 실행] HTML 네이티브 — 한 요청 버블 + 2×2 통합 답(메일·마감D-day·할일·채용뉴스) + 하단 ③실행형 -->
  <section class="slide light" id="P78">
    <style>
      #P78 .s-eyebrow{ left:120px; top:118px; }
      #P78 .s-title{ top:158px; font-size:66px; }
      #P78 .ex{ position:absolute; right:120px; top:118px; font-size:22px; font-weight:800; color:var(--muted);
        border:1.5px solid var(--rule); border-radius:999px; padding:7px 18px; }

      /* 한 줄 요청 → 한 번에 */
      #P78 .ask{ position:absolute; left:120px; top:322px; display:flex; align-items:center; gap:24px; }
      #P78 .ask .bubble{ background:var(--c1); color:#fff; font-size:32px; font-weight:800; border-radius:22px 22px 22px 6px;
        padding:20px 30px; box-shadow:0 8px 24px rgba(230,0,18,.18); }
      #P78 .ask .arrow{ font-size:30px; font-weight:800; color:var(--muted); }
      #P78 .ask .one{ font-size:28px; font-weight:800; color:var(--text); }
      #P78 .ask .one b{ color:var(--c1); }

      /* 2×2 통합 답 */
      #P78 .grid{ position:absolute; left:120px; top:452px; width:1680px;
        display:grid; grid-template-columns:1fr 1fr; gap:32px; }
      #P78 .blk{ background:#fff; border:1px solid var(--rule); border-radius:20px; padding:28px 34px;
        box-shadow:0 10px 30px rgba(0,0,0,.06); border-left:8px solid var(--bar); }
      #P78 .blk .top{ display:flex; align-items:center; gap:14px; margin-bottom:14px; }
      #P78 .blk .ic{ width:44px; height:44px; color:var(--bar); }
      #P78 .blk .name{ font-size:27px; font-weight:800; color:var(--bar); }
      #P78 .blk .txt{ font-size:28px; line-height:1.36; color:var(--text); font-weight:600; }
      #P78 .blk .txt b{ font-weight:800; }
      #P78 .blk.mail{ --bar:var(--c2); }
      #P78 .blk.dday{ --bar:var(--c1); }
      #P78 .blk.todo{ --bar:var(--c3); }
      #P78 .blk.news{ --bar:#7A3FD0; }

      #P78 .keymsg{ bottom:112px; }
      #P78 .keymsg .body{ font-size:36px; font-weight:700; color:var(--text); }
      #P78 .keymsg .acc{ color:var(--c1); font-weight:800; }
    </style>

    <div class="s-eyebrow">사례 ② · 취업준비생 지훈(26)</div>
    <h1 class="s-title">한 번 물으면, <span class="acc">내 앱을 가로질러</span> 답한다</h1>
    <div class="ex">예시 시나리오</div>

    <div class="ask">
      <div class="bubble">“오늘 나 뭐 챙겨야 하지?”</div>
      <div class="arrow">→</div>
      <div class="one">수지가 <b>네 앱을 한 번에</b> 훑어서</div>
    </div>

    <div class="grid">
      <div class="blk mail">
        <div class="top">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg>
          <span class="name">메일</span>
        </div>
        <div class="txt">지원한 3곳 중 <b>A사 서류 합격</b> 메일 도착</div>
      </div>
      <div class="blk dday">
        <div class="top">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <span class="name">마감 · 캘린더</span>
        </div>
        <div class="txt">B사 자소서 <b>D-2</b> · C사 면접 <b>D-5</b></div>
      </div>
      <div class="blk todo">
        <div class="top">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span class="name">오늘 할일</span>
        </div>
        <div class="txt">자소서 맞춤법 검사 · 포트폴리오 업데이트</div>
      </div>
      <div class="blk news">
        <div class="top">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8M15 18h-5M10 6h8v4h-8V6Z"/></svg>
          <span class="name">채용 뉴스 <span style="font-size:19px;color:var(--muted);font-weight:700;">· 외부앱</span></span>
        </div>
        <div class="txt">관심기업 <b>공채 3건</b> 신규 공고</div>
      </div>
    </div>

    <div class="keymsg">
      <span class="tag">③ 실행형</span>
      <span class="body">Q&amp;A가 아니라 <span class="acc">실제로 손을 움직여</span> — 흩어진 내 앱을 한 답으로 모은다</span>
    </div>

    <div class="s-footer">
      <span>에이전트 수지 · sooji.ai</span>
      <span class="s-pagenum">78</span>
    </div>
  </section>
</div>
</body>
</html>
