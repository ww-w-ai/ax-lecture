<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Pworld — 세계관의 변화</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="fit">
  <!-- Pworld [세계관의 변화·데이터/실행 반전] 하이브리드(bkit 템플릿=P55) — 좌: 제목·불릿 / 우: 일러스트 crop(../assets/P68-illust.png: 예전(데이터=서버·앱=내기기) → 반전 → 수지(데이터=나·앱=서버). 신설 2026-07-06 (원 P68 재활용) -->
  <section class="slide light" id="Pworld">
          <style>
            #Pworld .s-title{ font-size:64px; }
            #Pworld .s-title .acc{ color:var(--c1); }
            #Pworld .s-eyebrow{ left:122px; top:208px; font-size:35px; font-weight:600; color:var(--muted); }
            #Pworld .s-body{ top:323px; width:1040px; gap:30px; }
            #Pworld .s-bullet{ font-size:36px; }
            #Pworld .s-bullet .btxt{ line-height:1.34; }
            #Pworld .s-bullet .head{ font-weight:800; color:var(--text); }
            #Pworld .s-bullet .head .acc{ color:var(--c1); }
            #Pworld .s-bullet .head .t{ color:var(--c2); }
            #Pworld .s-bullet .desc{ display:block; font-size:30px; font-weight:500; color:var(--secondary); margin-top:4px; }
            #Pworld .keymsg .msg{ font-size:28px; font-weight:600; color:var(--text); }
            #Pworld .keymsg .msg b{ color:var(--c1); font-weight:800; }
            #Pworld .illust{ position:absolute; right:132px; top:294px; width:544px; height:auto; }
          </style>
      
          <h1 class="s-title" style="inset: 120px auto auto 120px;">수지가 제안하는 <span style="color: rgb(230, 0, 18);">세계관의 </span><span class="acc">변화</span></h1>
          <div class="s-eyebrow" style="inset: 208px auto auto 122px;">데이터와 실행, 방향이 뒤집힌다.</div>
      
          <div class="s-body" style="inset: 323px auto auto 120px; width: 895px;">
            <div class="s-bullet"><span class="dot"></span><span class="btxt"><span class="head">웹·모바일 시대</span><span class="desc"><span style="color: rgb(11, 95, 217); font-weight: bold;">서버가 데이터</span>를 쥐고 <span style="color: rgb(11, 95, 217); font-weight: bold;">→</span> 유저 PC/모바일에서 실행</span></span></div>
            <div class="s-bullet"><span class="dot"></span><span class="btxt"><span class="head"><span class="acc">에이전트 수지</span></span><span class="desc">서버가 실행하고&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<span style="color: rgb(11, 95, 217); font-weight: bold;">&lt;-</span> <span style="color: rgb(11, 95, 217); font-weight: bold;">유저가 데이터</span>를 제공</span></span></div>
            <div class="s-bullet"><span class="dot"></span><span class="btxt"><span class="head">원래 분리돼 있었다</span><span class="desc">데이터와 실행은 원래 나뉘어 있었습니다 — 분리는 자연스러운 구조</span></span></div>
            <div class="s-bullet"><span class="dot"></span><span class="btxt"><span class="head">방향만 반대일 뿐</span><span class="desc">에이전트 시대엔 방향이 뒤집힐 뿐 — 데이터 주권 + 24시간 온라인</span></span></div>
          </div>
      
          <div class="imgframe" style="inset: 199px auto auto 1023px; width: 825px; height: 629px; box-shadow: none; border-radius: 0px;"><img class="illust" alt="예전: 데이터=서버 / 앱=내 PC·모바일 → (반전) → 수지: 데이터=나(내가 관리·소유·영속) / 앱=서버에서 돈다(컴퓨트=우리)" style="inset: 0px auto auto 0px; width: 825px; height: auto;" src="../assets/P68-illust.png"></div>
      
          <div class="keymsg">
            <span class="tag">MESSAGE</span>
            <span class="msg">‘자비스’가 나타나기 위한 가장 중요한 관점의 전환 — <b>진짜 자비스가 나타난다.</b></span>
          </div>
      
          <div class="s-footer">
            <span>에이전트 수지 · sooji.ai</span>
            <span class="s-pagenum">76</span>
          </div>
        </section>
</div>
</body>
</html>
